name: Aura Health iOS + Feather Source

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the latest upstream tag even if it already exists
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 */3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-aura-ipa.yml"
      - "scripts/update_aura_source.py"

permissions:
  contents: write

concurrency:
  group: hc6q-feather-source
  cancel-in-progress: false

env:
  UPSTREAM_REPO: madebysan/aura-health

jobs:
  check:
    name: Check upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      published_at: ${{ steps.tag.outputs.published_at }}
      changelog_b64: ${{ steps.tag.outputs.changelog_b64 }}
      should_build: ${{ steps.tag.outputs.should_build }}
    steps:
      - name: Read latest Aura Health tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail

          refs="$(gh api "repos/${UPSTREAM_REPO}/git/refs/tags")"
          tag="$(jq -r '.[].ref | sub("^refs/tags/"; "") | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+([.-].*)?$"))' <<<"$refs" | sort -V | tail -n 1)"

          if [[ -z "$tag" ]]; then
            echo "No semantic version tag found."
            exit 1
          fi

          version="${tag#v}"
          commit="$(gh api "repos/${UPSTREAM_REPO}/commits/${tag}")"
          published_at="$(jq -r '.commit.committer.date' <<<"$commit")"
          changelog_b64="$(jq -r '(.commit.message // "") | @base64' <<<"$commit")"
          release_tag="aura-ios-${tag}"

          should_build=true
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            should_build=false
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${FORCE_BUILD:-false}" == "true" ]]; then
            should_build=true
          fi

          echo "Upstream: $tag"
          echo "Build required: $should_build"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          echo "changelog_b64=$changelog_b64" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish Aura Health IPA
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout upstream Aura Health tag
        uses: actions/checkout@v4
        with:
          repository: madebysan/aura-health
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 1

      - name: Restore public build configuration
        shell: bash
        run: |
          cat > Secrets.xcconfig <<'EOF'
          // Public build defaults. The v1.0.0 tag references this file but does not include it.
          WHOOP_CLIENT_ID =
          WHOOP_CLIENT_SECRET =
          #include? "Secrets.local.xcconfig"
          EOF

      - name: Show build environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Build unsigned Aura Health for iPhone
        env:
          AURA_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/aura-build"
          rm -rf "$BUILD_DIR"

          xcodebuild \
            -project AuraHealth.xcodeproj \
            -target AuraHealth \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$AURA_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

          APP_PATH="$(find "$BUILD_DIR" -type d -name 'AuraHealth.app' | head -n 1)"
          if [[ -z "$APP_PATH" ]]; then
            echo "AuraHealth.app was not produced."
            find "$BUILD_DIR" -maxdepth 5 -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app: $APP_PATH"

      - name: Package unsigned IPA
        env:
          AURA_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          find "$APP_PATH" -type d -name '_CodeSignature' -prune -exec rm -rf {} + || true
          find "$APP_PATH" -name 'embedded.mobileprovision' -delete || true

          PACKAGE_DIR="$RUNNER_TEMP/aura-package"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/AuraHealth.app"

          IPA="$GITHUB_WORKSPACE/AuraHealth-${AURA_VERSION}.ipa"
          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "$IPA" Payload
          )

          /usr/bin/unzip -t "$IPA"
          size="$(stat -f%z "$IPA")"

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PACKAGE_DIR/Payload/AuraHealth.app/Info.plist")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PACKAGE_DIR/Payload/AuraHealth.app/Info.plist")"
          echo "Bundle ID: $bundle_id"
          echo "Bundle version: $bundle_version"
          echo "IPA size: $size bytes"

          if [[ "$bundle_version" != "$AURA_VERSION" ]]; then
            echo "Expected bundle version $AURA_VERSION but got $bundle_version"
            exit 1
          fi

          echo "AURA_IPA=$IPA" >> "$GITHUB_ENV"
          echo "AURA_IPA_SIZE=$size" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          AURA_VERSION: ${{ needs.check.outputs.version }}
          AURA_TAG: ${{ needs.check.outputs.tag }}
          AURA_CHANGELOG_B64: ${{ needs.check.outputs.changelog_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="aura-ios-${AURA_TAG}"
          notes_file="$RUNNER_TEMP/aura-release-notes.md"

          python3 - <<'PY' > "$notes_file"
          import base64, os
          body = base64.b64decode(os.environ.get("AURA_CHANGELOG_B64", "")).decode("utf-8", errors="replace").strip()
          print("Unofficial unsigned iOS build of Aura Health, compiled automatically from the upstream tag.")
          print()
          print(f"Upstream: https://github.com/madebysan/aura-health/tree/{os.environ['AURA_TAG']}")
          print()
          print("## Upstream change")
          print(body or "No upstream changelog was provided.")
          print()
          print("Sign this IPA with Feather, AltStore, SideStore or another compatible sideloading tool.")
          PY

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$AURA_IPA" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$release_tag" \
              --title "Aura Health iOS ${AURA_VERSION}" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" "$AURA_IPA" \
              --title "Aura Health iOS ${AURA_VERSION}" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Checkout source metadata
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: source-repo
          token: ${{ github.token }}

      - name: Update Feather source
        env:
          AURA_VERSION: ${{ needs.check.outputs.version }}
          AURA_PUBLISHED_AT: ${{ needs.check.outputs.published_at }}
          AURA_CHANGELOG_B64: ${{ needs.check.outputs.changelog_b64 }}
          AURA_IPA_SIZE: ${{ env.AURA_IPA_SIZE }}
          AURA_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/aura-ios-${{ needs.check.outputs.tag }}/AuraHealth-${{ needs.check.outputs.version }}.ipa
          AURA_SOURCE_PATH: source-repo/source.json
        run: python3 source-repo/scripts/update_aura_source.py

      - name: Commit Feather source
        shell: bash
        run: |
          set -euo pipefail
          cd source-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json

          if git diff --cached --quiet; then
            echo "source.json is already current."
            exit 0
          fi

          git commit -m "Update Feather source for Aura Health ${{ needs.check.outputs.version }}"
          git push origin main

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraHealth-${{ needs.check.outputs.version }}-iOS
          path: AuraHealth-${{ needs.check.outputs.version }}.ipa
          if-no-files-found: error
          retention-days: 14
