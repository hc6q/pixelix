name: Build Pixelix IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned Pixelix
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Find app
        run: |
          find build -name "*.app" -type d

      - name: Create IPA
        run: |
          APP_PATH=$(find build -name "Pixelix.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Pixelix.app não encontrado"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Pixelix.app

          zip -qry Pixelix.ipa Payload

          ls -lh Pixelix.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pixelix-iOS
          path: Pixelix.ipa
