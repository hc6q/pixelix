name: DropStation iOS + Feather Source

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the latest upstream release even if it already exists
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "27 */3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-dropstation-ipa.yml"
      - "scripts/update_dropstation_source.py"

permissions:
  contents: write

concurrency:
  group: hc6q-feather-source
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Wenzlik/DropStation

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      published_at: ${{ steps.release.outputs.published_at }}
      changelog_b64: ${{ steps.release.outputs.changelog_b64 }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - name: Read latest DropStation release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail

          latest="$(gh api "repos/${UPSTREAM_REPO}/releases/latest")"
          tag="$(jq -r '.tag_name' <<<"$latest")"
          version="${tag#v}"
          published_at="$(jq -r '.published_at' <<<"$latest")"
          changelog_b64="$(jq -r '(.body // "") | @base64' <<<"$latest")"
          release_tag="dropstation-ios-${tag}"

          should_build=true
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            should_build=false
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${FORCE_BUILD:-false}" == "true" ]]; then
            should_build=true
          fi

          echo "Upstream: $tag"
          echo "Build required: $should_build"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          echo "changelog_b64=$changelog_b64" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish DropStation IPA
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout upstream DropStation release
        uses: actions/checkout@v4
        with:
          repository: Wenzlik/DropStation
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 1

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Build unsigned DropStation for iPhone
        env:
          DROPSTATION_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/dropstation-build"
          rm -rf "$BUILD_DIR"

          xcodebuild \
            -project DropStation.xcodeproj \
            -target DropStation \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$DROPSTATION_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

          APP_PATH="$(find "$BUILD_DIR" -type d -name 'DropStation.app' | head -n 1)"
          if [[ -z "$APP_PATH" ]]; then
            echo "DropStation.app was not produced."
            find "$BUILD_DIR" -maxdepth 5 -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app: $APP_PATH"

      - name: Package unsigned IPA
        env:
          DROPSTATION_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          find "$APP_PATH" -type d -name '_CodeSignature' -prune -exec rm -rf {} + || true
          find "$APP_PATH" -name 'embedded.mobileprovision' -delete || true

          PACKAGE_DIR="$RUNNER_TEMP/dropstation-package"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/DropStation.app"

          IPA="$GITHUB_WORKSPACE/DropStation-${DROPSTATION_VERSION}.ipa"
          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "$IPA" Payload
          )

          /usr/bin/unzip -t "$IPA"
          size="$(stat -f%z "$IPA")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PACKAGE_DIR/Payload/DropStation.app/Info.plist")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PACKAGE_DIR/Payload/DropStation.app/Info.plist")"

          echo "Bundle ID: $bundle_id"
          echo "Bundle version: $bundle_version"
          echo "IPA size: $size bytes"

          if [[ "$bundle_version" != "$DROPSTATION_VERSION" ]]; then
            echo "Expected bundle version $DROPSTATION_VERSION but got $bundle_version"
            exit 1
          fi

          echo "DROPSTATION_IPA=$IPA" >> "$GITHUB_ENV"
          echo "DROPSTATION_IPA_SIZE=$size" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DROPSTATION_VERSION: ${{ needs.check.outputs.version }}
          DROPSTATION_TAG: ${{ needs.check.outputs.tag }}
          DROPSTATION_CHANGELOG_B64: ${{ needs.check.outputs.changelog_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="dropstation-ios-${DROPSTATION_TAG}"
          notes_file="$RUNNER_TEMP/dropstation-release-notes.md"

          python3 - <<'PY' > "$notes_file"
          import base64, os
          body = base64.b64decode(os.environ.get("DROPSTATION_CHANGELOG_B64", "")).decode("utf-8", errors="replace").strip()
          print("Unofficial unsigned iPhone build of DropStation, compiled automatically from the upstream release.")
          print()
          print(f"Upstream: https://github.com/Wenzlik/DropStation/releases/tag/{os.environ['DROPSTATION_TAG']}")
          print()
          print("The upstream release only provides a simulator smoke-test .app; this release packages a physical-device arm64 app as an unsigned IPA for sideloading.")
          print()
          print("## Upstream release notes")
          print(body or "No upstream changelog was provided.")
          print()
          print("Sign this IPA with Feather, AltStore, SideStore or another compatible sideloading tool.")
          PY

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$DROPSTATION_IPA" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$release_tag" \
              --title "DropStation iOS ${DROPSTATION_VERSION}" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" "$DROPSTATION_IPA" \
              --title "DropStation iOS ${DROPSTATION_VERSION}" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Checkout source metadata
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: source-repo
          token: ${{ github.token }}

      - name: Update Feather source
        env:
          DROPSTATION_VERSION: ${{ needs.check.outputs.version }}
          DROPSTATION_PUBLISHED_AT: ${{ needs.check.outputs.published_at }}
          DROPSTATION_CHANGELOG_B64: ${{ needs.check.outputs.changelog_b64 }}
          DROPSTATION_IPA_SIZE: ${{ env.DROPSTATION_IPA_SIZE }}
          DROPSTATION_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/dropstation-ios-${{ needs.check.outputs.tag }}/DropStation-${{ needs.check.outputs.version }}.ipa
          DROPSTATION_SOURCE_PATH: source-repo/source.json
        run: python3 source-repo/scripts/update_dropstation_source.py

      - name: Commit Feather source
        shell: bash
        run: |
          set -euo pipefail
          cd source-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json

          if git diff --cached --quiet; then
            echo "source.json is already current."
            exit 0
          fi

          git commit -m "Update Feather source for DropStation ${{ needs.check.outputs.version }}"
          git push origin main

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropStation-${{ needs.check.outputs.version }}-iOS
          path: DropStation-${{ needs.check.outputs.version }}.ipa
          if-no-files-found: error
          retention-days: 14
