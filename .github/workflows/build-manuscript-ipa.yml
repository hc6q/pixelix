name: Manuscript iOS + Feather Source

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the current upstream version even if it already exists
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "7 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-manuscript-ipa.yml"
      - "scripts/update_manuscript_source.py"

permissions:
  contents: write

concurrency:
  group: hc6q-feather-source
  cancel-in-progress: false

env:
  UPSTREAM_REPO: manuscriptapp/manuscript

jobs:
  check:
    name: Check upstream version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      version: ${{ steps.upstream.outputs.version }}
      published_at: ${{ steps.upstream.outputs.published_at }}
      changelog_b64: ${{ steps.upstream.outputs.changelog_b64 }}
      should_build: ${{ steps.upstream.outputs.should_build }}
    steps:
      - name: Read Manuscript main version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail

          latest="$(gh api "repos/${UPSTREAM_REPO}/commits/main")"
          sha="$(jq -r '.sha' <<<"$latest")"
          published_at="$(jq -r '.commit.committer.date' <<<"$latest")"

          pbx_json="$(gh api "repos/${UPSTREAM_REPO}/contents/Manuscript/Manuscript.xcodeproj/project.pbxproj?ref=${sha}")"
          pbx_file="$RUNNER_TEMP/project.pbxproj"
          jq -r '.content' <<<"$pbx_json" | base64 --decode > "$pbx_file"

          version="$(python3 - "$pbx_file" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          pattern = r'MARKETING_VERSION = ([0-9]+(?:\.[0-9]+)+);[\s\S]{0,700}?PRODUCT_BUNDLE_IDENTIFIER = com\.dahlsjoo\.manuscript;'
          matches = re.findall(pattern, text)
          if not matches:
              raise SystemExit("Could not determine Manuscript MARKETING_VERSION")
          print(matches[0])
          PY
          )"

          notes_file="$RUNNER_TEMP/upstream-release-notes.md"
          if gh api "repos/${UPSTREAM_REPO}/contents/meta/RELEASE_NOTES.md?ref=${sha}" > "$RUNNER_TEMP/notes.json" 2>/dev/null; then
            jq -r '.content' "$RUNNER_TEMP/notes.json" | base64 --decode > "$notes_file"
          else
            printf '%s\n' "$(jq -r '.commit.message // ""' <<<"$latest")" > "$notes_file"
          fi

          changelog="$(python3 - "$notes_file" "$version" <<'PY'
          import re, sys
          path, version = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read().strip()
          match = re.search(rf'^## Version {re.escape(version)}\b[\s\S]*?(?=^## Version |\Z)', text, re.M)
          print((match.group(0) if match else text).strip())
          PY
          )"
          changelog_b64="$(printf '%s' "$changelog" | base64 | tr -d '\n')"

          release_tag="manuscript-ios-v${version}"
          should_build=true
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            should_build=false
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${FORCE_BUILD:-false}" == "true" ]]; then
            should_build=true
          fi

          echo "Upstream commit: $sha"
          echo "Version: $version"
          echo "Build required: $should_build"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          echo "changelog_b64=$changelog_b64" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish Manuscript IPA
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout upstream Manuscript commit
        uses: actions/checkout@v4
        with:
          repository: manuscriptapp/manuscript
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1

      - name: Show build environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project Manuscript/Manuscript.xcodeproj \
            -scheme manuscript \
            -resolvePackageDependencies \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Build unsigned Manuscript for iPhone
        env:
          MANUSCRIPT_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/manuscript-build"
          rm -rf "$BUILD_DIR"

          xcodebuild \
            -project Manuscript/Manuscript.xcodeproj \
            -scheme manuscript \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_DIR" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$MANUSCRIPT_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

          APP_PATH="$(find "$BUILD_DIR" -type d -name 'Manuscript.app' | head -n 1)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Manuscript.app was not produced."
            find "$BUILD_DIR" -maxdepth 7 -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app: $APP_PATH"

      - name: Package unsigned IPA
        env:
          MANUSCRIPT_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          find "$APP_PATH" -type d -name '_CodeSignature' -prune -exec rm -rf {} + || true
          find "$APP_PATH" -name 'embedded.mobileprovision' -delete || true

          PACKAGE_DIR="$RUNNER_TEMP/manuscript-package"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Manuscript.app"

          IPA="$GITHUB_WORKSPACE/Manuscript-${MANUSCRIPT_VERSION}.ipa"
          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "$IPA" Payload
          )

          /usr/bin/unzip -t "$IPA"
          size="$(stat -f%z "$IPA")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PACKAGE_DIR/Payload/Manuscript.app/Info.plist")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PACKAGE_DIR/Payload/Manuscript.app/Info.plist")"
          min_os="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PACKAGE_DIR/Payload/Manuscript.app/Info.plist" 2>/dev/null || echo '18.0')"

          echo "Bundle ID: $bundle_id"
          echo "Bundle version: $bundle_version"
          echo "Minimum iOS: $min_os"
          echo "IPA size: $size bytes"

          if [[ "$bundle_id" != "com.dahlsjoo.manuscript" ]]; then
            echo "Unexpected bundle identifier: $bundle_id"
            exit 1
          fi
          if [[ "$bundle_version" != "$MANUSCRIPT_VERSION" ]]; then
            echo "Expected bundle version $MANUSCRIPT_VERSION but got $bundle_version"
            exit 1
          fi

          echo "MANUSCRIPT_IPA=$IPA" >> "$GITHUB_ENV"
          echo "MANUSCRIPT_IPA_SIZE=$size" >> "$GITHUB_ENV"
          echo "MANUSCRIPT_MIN_OS=$min_os" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUSCRIPT_VERSION: ${{ needs.check.outputs.version }}
          MANUSCRIPT_SHA: ${{ needs.check.outputs.sha }}
          MANUSCRIPT_CHANGELOG_B64: ${{ needs.check.outputs.changelog_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="manuscript-ios-v${MANUSCRIPT_VERSION}"
          notes_file="$RUNNER_TEMP/manuscript-release-notes.md"

          python3 - <<'PY' > "$notes_file"
          import base64, os
          body = base64.b64decode(os.environ.get("MANUSCRIPT_CHANGELOG_B64", "")).decode("utf-8", errors="replace").strip()
          print("Unofficial unsigned iPhone build of Manuscript, compiled automatically from the upstream open-source project.")
          print()
          print(f"Upstream commit: https://github.com/manuscriptapp/manuscript/commit/{os.environ['MANUSCRIPT_SHA']}")
          print()
          print(body or "No upstream release notes were provided.")
          print()
          print("Sign this IPA with Feather, AltStore, SideStore or another compatible sideloading tool.")
          PY

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$MANUSCRIPT_IPA" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$release_tag" \
              --title "Manuscript iOS ${MANUSCRIPT_VERSION}" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" "$MANUSCRIPT_IPA" \
              --title "Manuscript iOS ${MANUSCRIPT_VERSION}" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Checkout source metadata
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: source-repo
          token: ${{ github.token }}

      - name: Update Feather source
        env:
          MANUSCRIPT_VERSION: ${{ needs.check.outputs.version }}
          MANUSCRIPT_PUBLISHED_AT: ${{ needs.check.outputs.published_at }}
          MANUSCRIPT_CHANGELOG_B64: ${{ needs.check.outputs.changelog_b64 }}
          MANUSCRIPT_IPA_SIZE: ${{ env.MANUSCRIPT_IPA_SIZE }}
          MANUSCRIPT_MIN_OS: ${{ env.MANUSCRIPT_MIN_OS }}
          MANUSCRIPT_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/manuscript-ios-v${{ needs.check.outputs.version }}/Manuscript-${{ needs.check.outputs.version }}.ipa
          MANUSCRIPT_SOURCE_PATH: source-repo/source.json
        run: python3 source-repo/scripts/update_manuscript_source.py

      - name: Commit Feather source
        shell: bash
        run: |
          set -euo pipefail
          cd source-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json

          if git diff --cached --quiet; then
            echo "source.json is already current."
            exit 0
          fi

          git commit -m "Update Feather source for Manuscript ${{ needs.check.outputs.version }}"
          git push origin main

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manuscript-${{ needs.check.outputs.version }}-iOS
          path: Manuscript-${{ needs.check.outputs.version }}.ipa
          if-no-files-found: error
          retention-days: 14
