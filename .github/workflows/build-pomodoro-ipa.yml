name: Pomodoro Timer iOS + Feather Source

on:
  workflow_dispatch:
  schedule:
    - cron: "29 11 * * *"
  push:
    paths:
      - ".github/workflows/build-pomodoro-ipa.yml"
      - "scripts/update_pomodoro_source.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source metadata
        uses: actions/checkout@v4
        with:
          path: source-meta

      - name: Checkout upstream Pomodoro Timer
        uses: actions/checkout@v4
        with:
          repository: Tsymlov/Pomodoro-Timer
          ref: dev
          path: upstream
          fetch-depth: 0

      - name: Read upstream metadata
        id: meta
        shell: bash
        run: |
          COUNT=$(git -C upstream rev-list --count HEAD)
          SHA=$(git -C upstream rev-parse HEAD)
          DATE=$(git -C upstream show -s --format=%cI HEAD)
          SUBJECT=$(git -C upstream show -s --format=%s HEAD)
          VERSION="1.0.${COUNT}"
          TAG="pomodoro-ios-v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Show build environment
        if: steps.meta.outputs.should_build == 'true'
        run: xcodebuild -version

      - name: Patch upstream iOS color compatibility
        if: steps.meta.outputs.should_build == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("upstream/Pomodoro Timer/UI/SettingsView.swift")
          s = p.read_text(encoding="utf-8")
          s = s.replace("import SwiftUI\n", "import SwiftUI\n#if os(iOS)\nimport UIKit\n#endif\n", 1)
          s = s.replace("Color(NSColor.windowBackgroundColor)", "Color(uiColor: UIColor.systemBackground)")
          s = s.replace("Color(NSColor.controlBackgroundColor)", "Color(uiColor: UIColor.secondarySystemBackground)")
          p.write_text(s, encoding="utf-8")
          print("Patched SettingsView.swift for iphoneos build")
          PY

      - name: Build unsigned iPhone app
        if: steps.meta.outputs.should_build == 'true'
        working-directory: upstream
        shell: bash
        run: |
          xcodebuild \
            -project "Pomodoro Timer.xcodeproj" \
            -target "Pomodoro Timer" \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.count }}" \
            build

      - name: Package unsigned IPA
        if: steps.meta.outputs.should_build == 'true'
        shell: bash
        run: |
          APP_PATH=$(find upstream/build -type d -name "Pomodoro Timer.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Pomodoro Timer.app not found"
            find upstream/build -type d -name "*.app" -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" "Payload/PomodoroTimer.app"
          ditto -c -k --sequesterRsrc --keepParent Payload "PomodoroTimer-${{ steps.meta.outputs.version }}.ipa"
          rm -rf Payload

          SIZE=$(stat -f%z "PomodoroTimer-${{ steps.meta.outputs.version }}.ipa")
          echo "IPA_SIZE=$SIZE" >> "$GITHUB_ENV"
          shasum -a 256 "PomodoroTimer-${{ steps.meta.outputs.version }}.ipa"
          ls -lh "PomodoroTimer-${{ steps.meta.outputs.version }}.ipa"

      - name: Publish GitHub release
        if: steps.meta.outputs.should_build == 'true'
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Unofficial unsigned iPhone build of Pomodoro Timer ${{ steps.meta.outputs.version }}, compiled automatically from the upstream MIT-licensed project.

          Upstream commit: https://github.com/Tsymlov/Pomodoro-Timer/commit/${{ steps.meta.outputs.sha }}
          Upstream change: ${{ steps.meta.outputs.subject }}

          Features include focus sessions, short and long breaks, session goals, statistics, persistent settings and local notifications.

          This IPA is unsigned. Sign it with Feather or another compatible sideloading tool before installing.
          EOF

          gh release create "${{ steps.meta.outputs.tag }}" \
            "PomodoroTimer-${{ steps.meta.outputs.version }}.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pomodoro Timer iOS ${{ steps.meta.outputs.version }}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Feather source
        if: steps.meta.outputs.should_build == 'true'
        shell: bash
        run: |
          cd source-meta
          export POMODORO_VERSION="${{ steps.meta.outputs.version }}"
          export POMODORO_PUBLISHED_AT="${{ steps.meta.outputs.date }}"
          export POMODORO_UPSTREAM_SHA="${{ steps.meta.outputs.sha }}"
          export POMODORO_CHANGELOG="${{ steps.meta.outputs.subject }}"
          export POMODORO_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.tag }}/PomodoroTimer-${{ steps.meta.outputs.version }}.ipa"
          export POMODORO_IPA_SIZE="$IPA_SIZE"
          python3 scripts/update_pomodoro_source.py

      - name: Commit Feather source
        if: steps.meta.outputs.should_build == 'true'
        working-directory: source-meta
        shell: bash
        run: |
          if git diff --quiet source.json; then
            echo "source.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Add Pomodoro Timer ${{ steps.meta.outputs.version }} to Feather source"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload IPA artifact
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroTimer-${{ steps.meta.outputs.version }}-iOS
          path: PomodoroTimer-${{ steps.meta.outputs.version }}.ipa
