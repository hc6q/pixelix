<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>{% block title %}PasteDrop{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="brand-mark">↗</span> PasteDrop</a><span class="top-note">Compartilhe em segundos.</span></header>
  <main>{% block content %}{% endblock %}</main>
  <footer>PasteDrop <span class="dot">·</span> Arquivos e textos temporários</footer>
</body>
</html>
